name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  # 1) 三平台构建 + 测试（Linux / macOS / Windows）
  build:
    name: build-${{ matrix.os }}-${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, cxx: g++ }
          - { os: ubuntu-22.04, cxx: clang++ }
          - { os: macos-14, cxx: clang++ }
          - { os: windows-2022, cxx: cl }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cxx }}" = "cl" ]; then
            cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DNQ_WERROR=ON
          else
            cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DNQ_WERROR=ON \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          fi
      - name: Build
        run: cmake --build build/ci --config Release -j 4
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Showcase (smoke)
        shell: bash
        run: ./build/ci/nq_showcase --out build/ci/showcase --no-png
        continue-on-error: true

  # 2) 覆盖率门禁 + Codecov 上传
  coverage:
    name: coverage (gate 95% lines / 80% branches)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y g++ gcovr
      - name: Build & test with gcov
        run: ./tools/coverage.sh
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: docs/coverage/
      - name: Upload to Codecov
        # 需要仓库 secret: CODECOV_TOKEN（未配置时该步骤自动跳过，不影响门禁）
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          files: docs/coverage/summary.json
          fail_ci_if_error: false
      - name: Coverage badge is up to date
        run: |
          if ! git diff --quiet -- docs/coverage/badge.svg docs/coverage/summary.json; then
            echo "::warning::coverage 产物已变化，请本地运行 tools/coverage.sh 后提交"
            git --no-pager diff --stat -- docs/coverage/
          fi

  # 3) Sanitizers（ASan + UBSan）
  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset asan
      - run: cmake --build --preset asan -j 4
      - run: ctest --preset asan --output-on-failure

  # 4) 冒烟基准（防止数量级退化；完整基准见 docs/06 §3）
  bench-smoke:
    name: bench-smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/bench -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/bench -j 4
      - name: Render showcase and report counters
        run: |
          ./build/bench/nq_showcase --out build/bench/showcase --no-png | tee bench.log
          echo "---- counters ----"
          tail -n 6 bench.log
